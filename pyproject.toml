[project]
name = "raspberrygirl-presenter"
version = "0.1.0"
description = "Raspberry Girl aggregate output module: waycast unit -> TTS + playback + Godot frontend + PPT."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "noteas", email = "3818384646@qq.com" }
]
dependencies = [
    "dashscope>=1.24,<2",
    "httpx2>=2.16,<3",
    "python-dotenv>=1,<2",
    "sounddevice==0.5.6",
    "websockets==17.4",
]

[project.scripts]
presenter = "presenter.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presenter"]

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2",
    "jsonschema>=4.23,<5",
    "pytest>=8",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
markers = [
    "real: needs real external services / devices (DashScope, audio out, hub); run on the dev machine",
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

# lint 规则集 = ruff 内置默认（四仓一致，不另选规则族；生效规则集由 uv.lock 钉死的 ruff 版本决定）。
